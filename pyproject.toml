[project]
name = "cotiza-pension"
version = "0.1.0"
description = "Probabilidad de que un trabajador colombiano cotice a pensión (GEIH 2025, DANE)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dane-data>=0.4",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=3.0",
    "scikit-learn>=1.8",
    "seaborn>=0.13",
    "streamlit>=1.67.0",
    "xgboost-cpu>=3.2.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cotiza_pension"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
